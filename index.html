<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Billu ❤️</title>

<style>
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    font-family: Arial, sans-serif;
    background: url('BG.jpg') no-repeat center center/cover;
    overflow: hidden;
    text-align: center;
    transition: background 0.8s ease;
}

h1 {
    max-width: 80%;
    padding: 0 20px;
    color: white;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
}

img {
    width: 320px;
    height: auto;
    margin-top: 20px;
    border-radius: 12px;
}

.buttons {
    margin-top: 30px;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    transition: all 0.3s ease;
}

#yesBtn {
    background-color: #ff4d6d;
    color: white;
}

#noBtn {
    background-color: #444;
    color: white;
}

.heart {
    position: fixed;
    font-size: 24px;
    animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<h1 id="question">Will you be my Valentine, Billu? ❤️</h1>

<img id="moodImage" src="gifs/1.gif">

<div class="buttons">
    <button id="yesBtn" onclick="sayYes()">Yes, I will be your Valentine ❤️</button>
    <button id="noBtn" onclick="sayNo()">No</button>
</div>

<script>

let noCount = 0;

const questions = [];
for (let i = 1; i <= 60; i++) {
    if (i % 7 === 0) {
        questions.push("Still sure, Billu? The YES is getting stronger...");
    } else if (i % 5 === 0) {
        questions.push("Billu, destiny is watching 👀");
    } else if (i % 3 === 0) {
        questions.push("Are you absolutely certain?");
    } else {
        questions.push("Are you sure, Billu?");
    }
}

const noButtonTexts = questions.map(() => "I am sure 😤");

function sayNo() {

    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const moodImage = document.getElementById("moodImage");

    question.innerText = questions[noCount % questions.length];
    noBtn.innerText = noButtonTexts[noCount % noButtonTexts.length];

    let gifIndex = ((noCount + 1) % 30) + 1;
    moodImage.src = "gifs/" + gifIndex + ".gif";

    noCount++;

    yesBtn.style.fontSize = (18 + noCount * 6) + "px";
    yesBtn.style.padding = (15 + noCount * 8) + "px " + (30 + noCount * 15) + "px";

    if (noCount > 45) {
        yesBtn.style.position = "fixed";
        yesBtn.style.top = "0";
        yesBtn.style.left = "0";
        yesBtn.style.width = "100vw";
        yesBtn.style.height = "100vh";
        yesBtn.style.borderRadius = "0";
        yesBtn.style.fontSize = "50px";
        yesBtn.style.zIndex = "999";
    }
}

function createHearts() {
    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }
}

function createConfetti() {
    for (let i = 0; i < 50; i++) {
        let conf = document.createElement("div");
        conf.style.position = "fixed";
        conf.style.width = "8px";
        conf.style.height = "8px";
        conf.style.background = `hsl(${Math.random()*360},100%,50%)`;
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.top = "-10px";
        conf.style.opacity = 1;
        conf.style.transition = "top 2s linear, opacity 2s";
        document.body.appendChild(conf);

        setTimeout(() => {
            conf.style.top = "100vh";
            conf.style.opacity = 0;
        }, 50);

        setTimeout(() => conf.remove(), 2000);
    }
}

function sayYes() {

    document.body.style.display = "block";

    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background: url('BG2.jpg') no-repeat center center/cover;
        ">
            <div style="
                position:absolute;
                inset:0;
                background: rgba(0,0,0,0.45);
            "></div>

            <div style="
                position:relative;
                z-index:2;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                width:100vw;
                flex-direction:column;
                text-align:center;
                color:white;
                font-family:Arial;
            ">
                <img id="happyImage" src="gifs/happygifs/1.gif" style="width:350px; border-radius:12px;">
                <h1 style="font-size:60px; margin:20px 0;">YAYYYY BILLU ❤️❤️❤️</h1>
                <p style="font-size:28px;">happi happi happi 😌</p>
                <p style="font-size:28px;">Happy Valentines Day mere jigar ke tukde 😘🥰</p>
            </div>
        </div>
    `;

    createConfetti();
    createHearts();

    let happyIndex = 1;

    setInterval(() => {
        happyIndex++;
        if (happyIndex > 6) happyIndex = 1;
        document.getElementById("happyImage").src =
            "gifs/happygifs/" + happyIndex + ".gif";
    }, 2000);
}

</script>

</body>
</html>
