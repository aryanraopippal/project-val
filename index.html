<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Billu ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: url('BG.jpg') no-repeat center center/cover;
    overflow: hidden;
    text-align: center;
    position: relative;
}

/* Dark overlay for BG.jpg */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 0;
}

#mainContainer {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 95vw;
    max-height: 95svh;
}

h1 {
    max-width: 90vw;
    padding: 0 15px;
    color: #ffffff;
    font-size: clamp(20px, 5vw, 40px);
    text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
    margin: 10px 0;
}

img {
    width: min(75vw, 300px);
    height: auto;
    margin: 10px 0;
    border-radius: 12px;
}

.buttons {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

button {
    padding: 10px 18px;
    font-size: clamp(14px, 4vw, 18px);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 6px;
    transition: all 0.4s ease;
}

#yesBtn {
    background-color: #ff4d6d;
    color: white;
}

#noBtn {
    background-color: #444;
    color: white;
    transition: all 0.4s ease;
}

.heart {
    position: fixed;
    font-size: 20px;
    animation: floatUp 4s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(100%); opacity: 1; }
    100% { transform: translateY(-120%); opacity: 0; }
}
</style>
</head>

<body>

<div id="mainContainer">

<h1 id="question">Will you be my Valentine, Billu? ❤️</h1>

<img id="moodImage" src="gifs/1.gif">

<div class="buttons">
    <button id="yesBtn" onclick="sayYes()">Yes, I will be your Valentine ❤️</button>
    <button id="noBtn" onclick="sayNo()">No</button>
</div>

</div>

<script>

let noCount = 0;

const questions = [];
for (let i = 1; i <= 60; i++) {
    if (i % 7 === 0) {
        questions.push("Still sure, Billu? The YES is getting stronger...");
    } else if (i % 5 === 0) {
        questions.push("Billu, destiny is watching 👀");
    } else if (i % 3 === 0) {
        questions.push("Are you absolutely certain?");
    } else {
        questions.push("Are you sure, Billu?");
    }
}

function sayNo() {

    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const moodImage = document.getElementById("moodImage");

    question.innerText = questions[noCount % questions.length];

    let gifIndex = ((noCount + 1) % 30) + 1;
    moodImage.src = "gifs/" + gifIndex + ".gif";

    noCount++;

    // YES grows
    let growth = Math.min(noCount * 2.5, 80);
    yesBtn.style.transform = `scale(${1 + growth / 100})`;

    // NO shrinks
    let shrink = Math.max(1 - (noCount * 0.04), 0);
    noBtn.style.transform = `scale(${shrink})`;

    // Fade NO
    if (noCount > 15) {
        let fade = Math.max(1 - ((noCount - 15) / 15), 0);
        noBtn.style.opacity = fade;
    }

    if (noCount > 30) {
        noBtn.style.display = "none";
    }

    if (noCount > 40) {
        yesBtn.style.position = "fixed";
        yesBtn.style.inset = "0";
        yesBtn.style.borderRadius = "0";
        yesBtn.style.fontSize = "clamp(26px, 8vw, 48px)";
        yesBtn.style.zIndex = "999";
        yesBtn.style.transform = "scale(1)";
    }
}

function createHearts() {
    for (let i = 0; i < 20; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (2 + Math.random() * 3) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }
}

function createConfetti() {
    for (let i = 0; i < 40; i++) {
        let conf = document.createElement("div");
        conf.style.position = "fixed";
        conf.style.width = "6px";
        conf.style.height = "6px";
        conf.style.background = `hsl(${Math.random()*360},100%,50%)`;
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.top = "-10px";
        conf.style.transition = "top 2s linear, opacity 2s";
        document.body.appendChild(conf);

        setTimeout(() => {
            conf.style.top = "100svh";
            conf.style.opacity = 0;
        }, 50);

        setTimeout(() => conf.remove(), 2000);
    }
}

function sayYes() {

    document.body.innerHTML = "";

    document.body.style.background = "url('BG2.jpg') no-repeat center center/cover";

    const overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.inset = "0";
    overlay.style.background = "rgba(0,0,0,0.45)";
    document.body.appendChild(overlay);

    const container = document.createElement("div");
    container.style.position = "relative";
    container.style.zIndex = "2";
    container.style.display = "flex";
    container.style.flexDirection = "column";
    container.style.justifyContent = "center";
    container.style.alignItems = "center";
    container.style.height = "100svh";
    container.style.width = "100vw";
    container.style.textAlign = "center";
    container.style.color = "white";
    container.style.fontFamily = "Arial";

    container.innerHTML = `
        <img id="happyImage" src="gifs/happygifs/1.gif" style="width:min(80vw,350px); border-radius:12px;">
        <h1 style="font-size:clamp(26px,6vw,60px); margin:20px 0;">YAYYYY BILLU ❤️❤️❤️</h1>
        <p style="font-size:clamp(18px,5vw,28px);">happi happi happi 😌</p>
        <p style="font-size:clamp(18px,5vw,28px);">Happy Valentines Day mere jigar ke tukde 😘🥰</p>
    `;

    document.body.appendChild(container);

    createConfetti();
    createHearts();

    let happyIndex = 1;

    setInterval(() => {
        happyIndex++;
        if (happyIndex > 6) happyIndex = 1;
        document.getElementById("happyImage").src =
            "gifs/happygifs/" + happyIndex + ".gif";
    }, 2000);
}

</script>

</body>
</html>
